document:
  dsl: '1.0.3'
  namespace: flowglad-examples
  name: skill-backed-code
  version: '1.0.0'
  metadata:
    fg:
      profile: https://flowglad.com/ows/profiles/automation/v1
      requiredExtensions:
        - https://flowglad.com/ows/extensions/capabilities/v1
        - https://flowglad.com/ows/extensions/runtime-profile/v1

      triggers:
        - id: on-demand
          manual:
            schema:
              format: jsonschema:2020-12
              document:
                type: object
                additionalProperties: false
                required: [value]
                properties:
                  value: {type: string}

use:
  catalogs:
    flowglad:
      endpoint:
        uri: https://flowglad.com/ows/catalogs/automation/v1

do:
  - process-value:
      input:
        from: '${ . }'
      call: code:1.0.0@flowglad
      with:
        fg:
          resource:
            kind: skill-revision
            revisionId: skr_replace_me
            path: scripts/main.py
          entrypoint: transform
          consumes: []
          produces: []
      timeout:
        after: PT30S
      output:
        schema:
          format: jsonschema:2020-12
          document:
            type: object
            additionalProperties: false
            required: [result]
            properties:
              result: {type: string}

  - decide-actions:
      input:
        from: '${ . }'
      call: code:1.0.0@flowglad
      with:
        fg:
          resource:
            kind: skill-revision
            revisionId: skr_replace_me
            path: scripts/main.py
          entrypoint: decide_actions
          terminal:
            kind: command-dag
      timeout:
        after: PT30S
      output:
        schema:
          format: jsonschema:2020-12
          document:
            type: object
            additionalProperties: false
            required: [title, reasoningSummary, nodes, edges]
            properties:
              title: {type: string}
              reasoningSummary: {type: string}
              nodes: {type: array, items: {type: object}}
              edges: {type: array, items: {type: object}}

output:
  as: '${ . }'
  schema:
    format: jsonschema:2020-12
    document:
      type: object
      additionalProperties: false
      required: [title, reasoningSummary, nodes, edges]
      properties:
        title: {type: string}
        reasoningSummary: {type: string}
        nodes: {type: array, items: {type: object}}
        edges: {type: array, items: {type: object}}
