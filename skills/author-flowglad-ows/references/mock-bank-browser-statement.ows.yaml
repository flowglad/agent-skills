document:
  dsl: '1.0.3'
  namespace: flowglad-evals
  name: browser-statement
  version: '1.0.0'
  title: Browser statement pipeline
  summary: >-
    Canonical OWS program for browser-agent to PDF artifact to code dataflow.
    The PDF declaration is a Flowglad artifact sidecar; OWS owns the structured
    value flow between the two tasks.
  metadata:
    fg:
      profile: https://flowglad.com/ows/profiles/automation/v1

use:
  catalogs:
    flowglad:
      endpoint:
        uri: https://flowglad.com/ows/catalogs/automation/v1

input:
  schema:
    format: jsonschema:2020-12
    document:
      type: object
      additionalProperties: false
      maxProperties: 0

do:
  - download-statement:
      input:
        from: '${ . }'
      call: browser-agent:1.0.0@flowglad
      with:
        fg:
          profile:
            id: statement_browser_profile
            connectionId: dsrc_statement
            instructions: Download the May sample statement as a PDF.
            maxSteps: 20
          produces:
            - name: statement-pdf
              mediaType: application/pdf
              maxBytes: 10000
              fileName: sample-statement.pdf
      timeout:
        after: PT60S
      output:
        schema:
          format: jsonschema:2020-12
          document:
            type: object
            additionalProperties: false
            required: [statementReady]
            properties:
              statementReady: {type: boolean}
      export:
        as: '${ $context + { browser: . } }'

  - verify-statement:
      input:
        from: '${ $context.browser }'
      call: code:1.0.0@flowglad
      with:
        fg:
          resource:
            kind: skill-revision
            revisionId: skr_eval_browser_statement_v1
            path: scripts/verify_statement_ows_v1.py
          entrypoint: verify_statement
          consumes:
            - statement-pdf
          terminal:
            kind: command-dag
      timeout:
        after: PT10S
      output:
        schema:
          format: jsonschema:2020-12
          document:
            type: object
      export:
        as: '${ $context + { terminalDag: . } }'

output:
  as: '${ $context.terminalDag }'
  schema:
    format: jsonschema:2020-12
    document:
      type: object
